name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  brain-tests:
    name: ProSpeechBrain · swift test
    runs-on: ubuntu-24.04
    container:
      image: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Run brain build + tests (single capture)
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/ci
          {
            echo "=== swift --version ==="
            swift --version
            echo
            echo "=== uname -a ==="
            uname -a
            echo
            echo "=== pwd / ls ==="
            pwd
            ls -la
            echo
            echo "=== swift package resolve ==="
            swift package resolve
            RESOLVE_RC=$?
            echo "[resolve rc=$RESOLVE_RC]"
            echo
            if [ $RESOLVE_RC -eq 0 ]; then
              echo "=== swift build -v ==="
              swift build -v
              BUILD_RC=$?
              echo "[build rc=$BUILD_RC]"
              echo
              if [ $BUILD_RC -eq 0 ]; then
                echo "=== swift test --parallel ==="
                swift test --parallel
                TEST_RC=$?
                echo "[test rc=$TEST_RC]"
              else
                TEST_RC=2
                echo "skipped tests (build failed)"
              fi
            else
              BUILD_RC=2
              TEST_RC=2
              echo "skipped build (resolve failed)"
            fi
            echo
            echo "=== summary: resolve=$RESOLVE_RC  build=$BUILD_RC  test=$TEST_RC ==="
            echo "$RESOLVE_RC $BUILD_RC $TEST_RC" > /tmp/ci/exit-codes.txt
          } 2>&1 | tee /tmp/ci/all.log
          # Always succeed so the next step posts the log; final step re-checks codes.
          exit 0
      - name: Post log to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch { return ''; }
            };
            const log = read('/tmp/ci/all.log');
            const codes = read('/tmp/ci/exit-codes.txt').trim() || '? ? ?';
            const tail = (s, n) => s.length > n ? '...(truncated; tail only)\n' + s.slice(-n) : s;
            const errors = (() => {
              const lines = log.split('\n');
              const out = [];
              for (let i = 0; i < lines.length; i++) {
                if (/error:|FAILED|Test Suite.*failed|✘|fatal error/i.test(lines[i])) {
                  const start = Math.max(0, i - 1);
                  const end = Math.min(lines.length, i + 5);
                  out.push(lines.slice(start, end).join('\n'));
                }
              }
              return out.join('\n---\n').slice(0, 6000) || '(no error-tagged lines)';
            })();
            const body = [
              '## brain-tests result',
              '',
              `**exit codes (resolve build test):** \`${codes}\``,
              '',
              '### Errors (grepped from full log)',
              '```',
              errors,
              '```',
              '',
              '### Full log · tail',
              '<details><summary>show last 10k chars</summary>',
              '',
              '```',
              tail(log || '(empty)', 10000),
              '```',
              '</details>'
            ].join('\n');
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Upload log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-tests-log
          path: /tmp/ci/
          if-no-files-found: ignore
      - name: Fail job if anything failed
        shell: bash
        run: |
          codes=$(cat /tmp/ci/exit-codes.txt 2>/dev/null || echo "1 1 1")
          set -- $codes
          resolve=${1:-1}
          build=${2:-1}
          test=${3:-1}
          echo "exit codes: resolve=$resolve build=$build test=$test"
          if [ "$resolve" != "0" ] || [ "$build" != "0" ] || [ "$test" != "0" ]; then
            exit 1
          fi

  xcodegen-check:
    name: XcodeGen spec · validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          set -e
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: List schemes
        run: xcodebuild -list -project ProSpeech.xcodeproj

  ios-build:
    name: iOS app · build (best-effort)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Available simulator runtimes
        run: xcrun simctl list runtimes
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProSpeech.xcodeproj \
            -scheme ProSpeech \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
