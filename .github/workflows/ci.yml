name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  brain-tests:
    name: ProSpeechBrain · swift test
    runs-on: ubuntu-24.04
    container:
      image: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: swift --version
      - name: Resolve packages
        id: resolve
        run: |
          set -o pipefail
          swift package resolve 2>&1 | tee /tmp/resolve.log
      - name: Build (verbose)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build -v 2>&1 | tee /tmp/build.log
      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee /tmp/test.log
      - name: Post failure log to PR
        if: failure() || steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = (path, n) => {
              try {
                const s = fs.readFileSync(path, 'utf8');
                return s.length > n ? '...(truncated; tail only)\n' + s.slice(-n) : s;
              } catch { return '(no log)'; }
            };
            const grepErrors = (path) => {
              try {
                const s = fs.readFileSync(path, 'utf8');
                const lines = s.split('\n');
                const out = [];
                for (let i = 0; i < lines.length; i++) {
                  if (/error:|warning:|FAILED|Test Suite|❌|✘/.test(lines[i])) {
                    const start = Math.max(0, i - 1);
                    const end = Math.min(lines.length, i + 4);
                    out.push(lines.slice(start, end).join('\n'));
                  }
                }
                return out.join('\n---\n').slice(0, 6000) || '(no error lines matched)';
              } catch { return '(no log)'; }
            };
            const body = [
              '## brain-tests CI failure',
              '',
              '### Errors (grepped)',
              '```',
              grepErrors('/tmp/build.log'),
              '```',
              '',
              '### swift build · tail',
              '<details><summary>show</summary>',
              '',
              '```',
              tail('/tmp/build.log', 8000),
              '```',
              '</details>',
              '',
              '### swift test · tail',
              '<details><summary>show</summary>',
              '',
              '```',
              tail('/tmp/test.log', 8000),
              '```',
              '</details>'
            ].join('\n');
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            } else {
              core.summary.addRaw(body).write();
            }
      - name: Fail if build or test failed
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1

  xcodegen-check:
    name: XcodeGen spec · validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          set -e
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: List schemes
        run: xcodebuild -list -project ProSpeech.xcodeproj

  ios-build:
    name: iOS app · build (best-effort)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Available simulator runtimes
        run: xcrun simctl list runtimes
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProSpeech.xcodeproj \
            -scheme ProSpeech \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
